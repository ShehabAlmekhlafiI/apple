<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Tech - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f0f; color: #f1f1f1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .custom-card { background-color: #1a1a1a; border: 1px solid #333; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .nav-pills .nav-link { color: #ccc; font-size: 0.85rem; }
        .nav-pills .nav-link:hover, .nav-pills .nav-link.active { background-color: #0dcaf0; color: #000; font-weight: bold; }
        .text-clear-muted { color: #cfcfcf !important; }
    </style>
</head>
<body>

    <div class="container mt-4 mb-5" style="max-width: 650px;">
        
        <!-- شريط التنقل الشامل -->
        <div class="custom-card p-3 mb-4 text-center">
            <h3 class="text-info mb-3">🍏 Apple Tech</h3>
            <ul class="nav nav-pills nav-fill justify-content-center gap-1">
                <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                <li class="nav-item"><a class="nav-link" href="hardware.html">المنتجات</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">تواصل معنا</a></li>
                <li class="nav-item"><a class="nav-link active" href="login.html">تسجيل الدخول</a></li>
            </ul>
        </div>

        <!-- نموذج تسجيل الدخول وإنشاء الحساب -->
        <div class="custom-card p-4 mb-4">
            
            <!-- نموذج تسجيل الدخول -->
            <div id="loginSection">
                <h4 class="text-info mb-3">تسجيل الدخول</h4>
                <form onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label">البريد الإلكتروني</label>
                        <input type="email" id="loginEmail" class="form-control bg-dark text-light border-secondary" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" id="loginPass" class="form-control bg-dark text-light border-secondary" placeholder="6 خانات على الأقل" required>
                    </div>
                    <button type="submit" class="btn btn-info w-100 fw-bold">دخول</button>
                </form>
                <p class="text-center mt-3 text-clear-muted small">ليس لديك حساب؟ <a href="#" onclick="toggleForm()" class="text-info">إنشاء حساب جديد</a></p>
            </div>

            <!-- نموذج إنشاء حساب -->
            <div id="registerSection" style="display: none;">
                <h4 class="text-info mb-3">إنشاء حساب جديد</h4>
                <form onsubmit="handleRegister(event)">
                    <div class="mb-3">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" id="regName" class="form-control bg-dark text-light border-secondary" placeholder="المهندس شهاب" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">البريد الإلكتروني</label>
                        <input type="email" id="regEmail" class="form-control bg-dark text-light border-secondary" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور (6 أحرف أو أرقام على الأقل)</label>
                        <input type="password" id="regPass" class="form-control bg-dark text-light border-secondary" placeholder="**" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">تسجيل الحساب</button>
                </form>
                <p class="text-center mt-3 text-clear-muted small">لديك حساب بالفعل؟ <a href="#" onclick="toggleForm()" class="text-info">تسجيل الدخول</a></p>
            </div>

        </div>

        <footer class="text-center text-clear-muted mb-4">
            <small>جميع الحقوق محفوظة © Apple Tech 2026</small>
        </footer>

    </div>

    <!-- إشعار الـ Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="myToast" class="toast" role="alert">
            <div class="toast-header bg-success text-white" id="toastHeader">
                <strong class="me-auto">إشعار النظام</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body text-dark fw-bold bg-light" id="toastMsg">تمت العملية بنجاح</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleForm() {
            var logSec = document.getElementById('loginSection');
            var regSec = document.getElementById('registerSection');
            if (logSec.style.display === 'none') {
                logSec.style.display = 'block';
                regSec.style.display = 'none';
            } else {
                logSec.style.display = 'none';
                regSec.style.display = 'block';
            }
        }

        // دالة إنشاء حساب جديد والتحقق من الشروط
        function handleRegister(event) {
            event.preventDefault();
            var name = document.getElementById('regName').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var pass = document.getElementById('regPass').value;

            // شرط طول كلمة المرور (6 خانات على الأقل)
            if (pass.length < 6) {
                showToast("كلمة المرور يجب ألا تقل عن 6 خانات أو حروف!", true);
                return;
            }

            // التحقق هل البريد مسجل مسبقاً في الذاكرة المحلية
            if (localStorage.getItem(email)) {
                showToast("هذا البريد الإلكتروني مسجل مسبقاً، حاول تسجيل الدخول!", true);
                return;
            }

            // حفظ بيانات المستخدم في التخزين المحلي
            var userData = { name: name, pass: pass };
            localStorage.setItem(email, JSON.stringify(userData));

            showToast("تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.", false);
            
            // التبديل تلقائياً لواجهة تسجيل الدخول بعد التسجيل الناجح
            setTimeout(function() {
                toggleForm();
            }, 1500);
        }

        // دالة تسجيل الدخول والتحقق من البيانات المخزنة
        function handleLogin(event) {
            event.preventDefault();
            var email = document.getElementById('loginEmail').value.trim();
            var pass = document.getElementById('loginPass').value;

            // جلب البيانات المخزنة لنفس البريد
            var storedUser = localStorage.getItem(email);

            if (!storedUser) {
                showToast("البريد الإلكتروني غير مسجل، يرجى إنشاء حساب جديد أولاً!", true);
                return;
            }

            var userObj = JSON.parse(storedUser);

            // التحقق من صحة كلمة المرور
            if (userObj.pass !== pass) {
                showToast("كلمة المرور غير صحيحة!", true);
                return;
            }

            showToast("تم تسجيل الدخول بنجاح، أهلاً بك يا " + userObj.name + "!", false);
        }

        function showToast(msg, isError) {
            document.getElementById('toastMsg').innerText = msg;
            var headerEl = document.getElementById('toastHeader');
            if (isError) {
                headerEl.className = "toast-header bg-danger text-white";
            } else {
                headerEl.className = "toast-header bg-success text-white";
            }
            var tEl = document.getElementById('myToast');
            var t = new bootstrap.Toast(tEl);
            t.show();
        }
    </script>
</body>
</html>
